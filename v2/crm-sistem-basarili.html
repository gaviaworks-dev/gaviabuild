<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>İşlem Başarılı — Gavia CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="assets/css/tokens.css">
<style>
  /* ============ KABUKSUZ SİSTEM DURUM DİLİ — 404.html'den devralındı (K-08 fallback) ============
     bkz. crm-sistem-403.html üst yorum bloğu — aynı köken notu geçerli.
     GENEL "işlem başarılı" KALIBI — modül-nötr, ?baslik=&mesaj=&donus=&donusEtiket=
     param'lı. Herhangi bir form/akış tamamlandığında buraya yönlendirilebilir.
     Statik bake: parametresiz açılışta anlamlı bir VARSAYILAN gösterir. */
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:40px 20px;background:var(--gv-deep);color:var(--gv-on-dark);
    font-family:var(--font);font-weight:500;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(rgba(63,213,173,.07) 1px,transparent 1px);
    background-size:24px 24px;
  }
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--gv-mint);outline-offset:2px}

  .wrap{width:100%;max-width:480px;text-align:center}
  /* GÖRSEL DENETİM #1 düzeltmesi (yüksek öncelik): K-11 marka kilidi tek kare "G" — bu
     sayfa ailenin diğer 4 üyesiyle (403/500/bakım/bağlantı-yok) AYNI .mark'ı kullanır.
     Durum ikonu (✓) mark'ın YERİNE değil, başlığın İÇİNDE ikincil semantik işaret olarak
     kalır (bkz. h1 içindeki inline ikon) — 404.html'in .mark'ıyla birebir aynı CSS. */
  .mark{
    width:56px;height:56px;margin:0 auto 26px;border-radius:15px;
    background:var(--gv-mint-glow);border:1px solid rgba(63,213,173,.3);
    display:grid;place-items:center;
    color:var(--gv-mint);font-weight:800;font-size:23px;letter-spacing:-.03em;
  }
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gv-mint);margin-bottom:14px}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#fff;margin-bottom:10px}
  h1 .h1-ico{color:var(--gv-mint);font-size:.82em;margin-right:8px;vertical-align:-1px}
  .sub{font-size:14px;line-height:1.65;color:var(--on-dark-mut);max-width:410px;margin:0 auto 30px}

  .acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:12px;
    font-size:13.5px;font-weight:700;transition:.22s var(--ease);
  }
  .btn i{font-size:12.5px}
  .btn-mint{background:var(--gv-mint);color:var(--gv-deep)}
  .btn-mint:hover{background:var(--gv-mint-bright);transform:translateY(-2px);box-shadow:0 14px 34px rgba(63,213,173,.25)}
  .btn-ghost{background:rgba(20,21,51,.6);color:var(--gv-on-dark);border:1px solid var(--gv-border-dark)}
  .btn-ghost:hover{border-color:rgba(63,213,173,.4);color:var(--gv-mint);transform:translateY(-2px)}

  .foot{margin-top:36px;font-size:11.5px;color:var(--on-dark-faint);line-height:1.7}
  .foot a{color:var(--on-dark-mut);font-weight:700}
  .foot a:hover{color:var(--gv-mint)}
  @media(prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>
  <main class="wrap">
    <div class="mark">G</div>
    <div class="eyebrow">İşlem Tamamlandı</div>
    <h1 id="baslikTxt"><i class="fa-solid fa-circle-check h1-ico" aria-hidden="true"></i>İşleminiz kaydedildi</h1>
    <p class="sub" id="mesajTxt">Talebiniz başarıyla alındı ve ilgili sürece iletildi.</p>

    <div class="acts">
      <a class="btn btn-mint" id="devamBtn" href="crm-panel.html"><i class="fa-solid fa-arrow-right"></i> <span id="devamTxt">Devam Et</span></a>
      <a class="btn btn-ghost" id="panelBtn" href="crm-panel.html"><i class="fa-solid fa-house"></i> Panele Dön</a>
    </div>
    <p class="foot">
      Gavia CRM — tıklanabilir arayüz prototipi, veriler kurgusaldır.<br>
      <a href="https://gaviaworks.com" target="_blank" rel="noopener">Gaviaworks</a> tarafından geliştirilmektedir.
    </p>
  </main>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var baslik = q.get('baslik');
  var mesaj = q.get('mesaj');
  var donus = q.get('donus');
  var donusEtiket = q.get('donusEtiket');
  /* textContent DEĞİL — h1 içindeki .h1-ico ikonunu (görsel denetim #1 düzeltmesi) korumak
     için yalnız metin düğümünü güncelliyoruz, ikon elementine dokunmuyoruz */
  if(baslik){
    var h1 = document.getElementById('baslikTxt');
    var textNode = Array.prototype.slice.call(h1.childNodes).filter(function(n){ return n.nodeType === 3; })[0];
    if(textNode) textNode.textContent = baslik; else h1.appendChild(document.createTextNode(baslik));
  }
  if(mesaj) document.getElementById('mesajTxt').textContent = mesaj;
  var devamBtn = document.getElementById('devamBtn');
  if(donus){ devamBtn.href = donus; }
  if(donusEtiket) document.getElementById('devamTxt').textContent = donusEtiket;
  /* dönüş hedefi zaten panel ise ikinci butonu tekrarlamamak için gizle */
  if((donus || 'crm-panel.html') === 'crm-panel.html') document.getElementById('panelBtn').style.display = 'none';
})();
</script>
</body>
</html>
