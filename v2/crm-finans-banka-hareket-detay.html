<style>
.gd-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.gd-head h1{font-size:22px;letter-spacing:-.015em;margin-bottom:9px;max-width:640px}
.gd-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gd-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc-ink);margin-bottom:8px}
.gd-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media(max-width:980px){.gd-grid{grid-template-columns:minmax(0,1fr)}}
.gd-grid > .gv-side-stack{min-width:0}
.gd-block{padding:22px}
.gd-block + .gd-block{border-top:1px solid var(--line)}
.gd-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.gd-desc{font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.ctx-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;font-size:13px;border-bottom:1px solid var(--line)}
.ctx-row:last-child{border-bottom:none}
.ctx-row .ctx-lbl{color:var(--muted)}
.ctx-row .ctx-val{color:var(--ink);font-weight:700;text-align:right}
.ctx-row .ctx-val a{color:var(--acc-ink)}
.gv-side-stack{display:flex;flex-direction:column;gap:16px}
.tot-hero{background:var(--bg);border-radius:var(--r-md);padding:18px;text-align:center;margin-bottom:4px}
.tot-hero b{display:block;font-size:26px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tot-hero span{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tot-hero.in b{color:var(--ok)}
.tot-hero.out b{color:var(--danger)}
.file-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.file-row:last-child{border-bottom:none}
.file-ico{width:36px;height:36px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--info-tint);color:var(--info)}
.file-ico.pdf{background:var(--danger-tint);color:var(--danger)}
.file-info{flex:1;min-width:0;line-height:1.35}
.file-info b{display:block;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-info span{font-size:11.5px;color:var(--muted)}
.no-belge{font-size:12.5px;color:var(--muted);padding:6px 0}
.link-row{display:flex;align-items:center;gap:11px;padding:9px 0}
.link-row .who-mark{width:34px;height:34px;flex:none;border-radius:var(--r-sm);display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--bg);color:var(--ink-2)}
.link-row a{font-size:13px;font-weight:700;color:var(--ink)}
.link-row a:hover{color:var(--acc-ink)}
.link-row span{display:block;font-size:11.5px;color:var(--muted)}
</style>
</head>

            <div class="ctx-row"><span class="ctx-lbl">Onay durumu</span><span class="ctx-val" id="vOnayDurum">—</span></div>

          <div class="gd-block">

          <div class="gd-block">

          </div>
        </div>

  </main>
</div>

  } else {
    belgeWrap.innerHTML = '<p class="no-belge">Bu hareket için belge eklenmemiş.</p>';
  }

  var linksWrap = document.getElementById('linksWrap');
  var linksHtml = '';
  if(r.cari && r.cari !== '—') linksHtml += '<div class="link-row"><div class="who-mark">' + r.cari.slice(0,2).toUpperCase() + '</div><div><a href="crm-cari-detay.html">' + r.cari + '</a><span>Cari / Firma bağlantısı</span></div></div>';
  if(r.santiye && r.santiye !== '—') linksHtml += '<div class="link-row"><div class="who-mark" style="background:rgba(var(--acc-rgb),.12);color:var(--acc-ink)">ŞN</div><div><a href="crm-santiye-detay.html">' + r.santiye + '</a><span>Şantiye bağlantısı</span></div></div>';
  if(r.link) linksHtml += '<div class="link-row"><div class="who-mark" style="background:var(--info-tint);color:var(--info)">' + r.link.ini + '</div><div><a href="' + r.link.href + '">' + r.link.lbl + '</a><span>Kaynak modül kaydı — ' + r.kaynak + '</span></div></div>';
  linksWrap.innerHTML = linksHtml || '<p class="no-belge">Bu hareket doğrudan bir cari, şantiye veya kaynak modül kaydına bağlı değil.</p>';

  document.getElementById('btnEdit').href = 'crm-finans-banka-hareket-form.html?mod=duzenle&id=' + id;
  document.getElementById('btnCikti').href = 'crm-finans-banka-cikti.html?hesap=' + r.hesap;

  if(curOnay === 'bekliyor'){
    var btnOnayla = document.getElementById('btnOnayla');
    btnOnayla.hidden = false;
    btnOnayla.addEventListener('click', function(){
      gvConfirm({
        icon:'fa-check', title: id + ' onaylansın mı?',
        message: '"' + r.aciklama + '" hareketi onaylanacak; hesabın güncel bakiyesine dahil edilir.',
        ok:'Onayla', cancel:'Vazgeç',
        onConfirm:function(){
          var m = loadOnay(); m[id] = 'onaylandi'; saveOnay(m);
          gvToast(id + ' onaylandı.');
          setTimeout(function(){ location.reload(); }, 700);
        }
      });
    });
  }
})();
</script>
</body>
</html>
