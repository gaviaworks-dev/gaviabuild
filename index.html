<!DOCTYPE html>

<head>

<title>Gavia CRM — yönlendiriliyor</title>

<!-- ============================================================================
     KÖK YÖNLENDİRME → v2/
     ============================================================================
     GitHub Pages bu depoda `main` dalının KÖK klasörünü yayınlıyor
     (build_type: legacy, source: {branch: main, path: "/"}). Yani çıplak adres
     `gaviaworks-dev.github.io/gaviacrm/` kökü servis ediyor.

     Kökte 31 Temmuz 2026'da `285d6cb` ("promote the current build from v3 to the
     repository root") ile terfi ettirilmiş ARA BUILD duruyordu. Ağustos revizyonu
     (G-1..G-9 + Bölüm 2/3, 13/13 teslim kriteri) o kopyaya UYGULANMADI — yalnız
     `v2/` altına uygulandı. Sonuç: çıplak adres revize EDİLMEMİŞ sürümü
     gösteriyordu, yani incelemeye gönderilen link yanlış build'i açıyordu.

     Kök artık tek kaynağa, `v2/`'ye yönlendiriyor. v2 tamamen kendi kendine yeten
     bir kopya: kendi `assets/`'i var, hiçbir yerde `../` kullanmıyor, kök de ona
     link vermiyordu — yönlendirme iki tarafı da bozmuyor.

     Neden yönlendirme, neden v2'yi köke taşımadım: köke terfi 240 dosyanın yolunu
     değiştirir ve revizyonun tamamının yeni URL'lerde yeniden doğrulanmasını
     gerektirir. Yönlendirme aynı kullanıcı sonucunu TEK dosyayla verir ve tek
     commit ile geri alınabilir.

     Üç katman birlikte: meta refresh (JS kapalıysa çalışır), canonical (arama
     motoru için), JS replace (geçmişte çift kayıt bırakmaz). Görünür bağlantı da
     var ki otomatik yönlendirme engellenirse kullanıcı elle geçebilsin.
     ============================================================================ -->
<meta http-equiv="refresh" content="0; url=v2/">
<link rel="canonical" href="https://gaviaworks-dev.github.io/gaviacrm/v2/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v2/assets/css/tokens.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:40px 20px;background:var(--gv-deep);color:var(--gv-on-dark);
    font-family:var(--font);font-weight:500;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(rgba(63,213,173,.07) 1px,transparent 1px);
    background-size:24px 24px;text-align:center;
  }
  .wrap{max-width:420px}
  .mark{
    width:56px;height:56px;margin:0 auto 24px;border-radius:15px;
    background:var(--gv-mint-glow);border:1px solid rgba(63,213,173,.3);
    display:grid;place-items:center;
    color:var(--gv-mint);font-weight:800;font-size:23px;letter-spacing:-.03em;
  }
  h1{font-size:19px;font-weight:800;letter-spacing:-.02em;color:#fff;margin-bottom:9px}
  p{font-size:13.5px;line-height:1.65;color:var(--gv-on-dark-soft)}
  .go{
    display:inline-flex;align-items:center;gap:8px;margin-top:22px;
    padding:11px 20px;border-radius:10px;
    background:var(--gv-mint);color:var(--gv-deep);
    font-size:13.5px;font-weight:800;text-decoration:none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">G</div>
    <h1>Gavia CRM</h1>
    <p>Güncel sürüme yönlendiriliyorsunuz. Sayfa kendiliğinden açılmazsa aşağıdaki bağlantıyı kullanın.</p>
    <a class="go" href="v2/">Gavia CRM'e git &rarr;</a>
  </div>
<script>location.replace('v2/');</script>
</body>
</html>
